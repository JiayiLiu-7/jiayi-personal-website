  about:
    enable: true
    title: "About Me"
    image: ""
    content: |-
      I'm a Social Data Science graduate from University of Copenhagen(KU) with professional experience in analytics and data engineering.

      I enjoy turning complex, manual processes into simple and practical data solutions, combining technical problem-solving with an understanding of real business needs.

      I'm currently exploring opportunities in data and AI where I can keep building, learning, and solving meaningful problems.
  skills:
