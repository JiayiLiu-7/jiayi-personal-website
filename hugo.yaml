            text: >-
              Explored diabetes prevalence and the healthcare landscape
              across low- and middle-income countries alongside WDF's
              project activities and outcomes.

          - title: "India Deep Dive"
            text: >-
              Examined the diabetes challenge in India using health,
              population, and market datasets available for the case.

          - title: "Decision Support"
            text: >-
              Translated data analysis into practical recommendations
              around where data and interventions could support future
              diabetes prevention and care.

        technologies:
