  experience:
    enable: true
    title: "Experience"

    company: "SupplyPartner ApS & Wooden Spoon ApS"
    role: "Analytics Engineer"
    date: "Jul 2024 – Dec 2025"
    location: "Copenhagen, Denmark"

    intro: >-
      Built data solutions from the ground up by translating business needs
      into technical solutions for data processing, automation, and analytics.
    
    workflows:
      - number: "01"
        category: "Data Platform"
        title: "Build the Foundation"
        subtitle: "From fragmented files to a structured data platform"

        description: >-
          Designed and built an Azure-based data platform from the ground up,
          replacing fragmented manual data processes with structured,
          analysis-ready workflows.

        steps:
          - icon: "fas fa-folder-open"
            class: "sharepoint"
            label: "SharePoint"
            detail: "Customer files"

          - icon: "fas fa-cloud"
            class: "azure"
            label: "Azure Blob"
            detail: "Data intake"

          - icon: "fas fa-cogs"
            class: "adf"
            label: "Azure Data Factory"
            detail: "Transform"

          - icon: "fas fa-database"
            class: "sql"
            label: "Azure SQL"
            detail: "Structured data"

        impact:
          - value: "30+"
            label: "Data Pipelines"

          - value: "10+"
            label: "Customer Workflows"

      # =====================================================
      # 02 — AUTOMATION
      # =====================================================

      - number: "02"
        category: "Automation"
        title: "Automate the Work"
        subtitle: "From repetitive manual work to practical automation"

        description: >-
          Turned recurring business processes into practical automation tools
          by translating business rules into Python applications and
          Power Automate workflows.

        automationItems:

          - icon: "fab fa-python"
            class: "python"
            title: "Product Data Preparation"
            text: >-
              Built a Python desktop tool to validate, clean, and enrich
              product catalog data before manual webshop upload.

          - icon: "fas fa-bolt"
            class: "powerautomate"
            title: "File Intake Automation"
            text: >-
              Used Power Automate to detect incoming files and route data
              into Azure storage for downstream processing.

        transformation:
          before: "~2 hours"
          beforeLabel: "Manual data preparation"
          after: "<10 min"
          afterLabel: "Automated preparation"


      # =====================================================
      # 03 — ANALYTICS
      # =====================================================

      - number: "03"
        category: "Analytics"
        title: "Turn Data into Decisions"
        subtitle: "From structured data to self-service insights"

        description: >-
          Built Power BI solutions on structured data models, turning
          operational data into accessible insights for business teams.

        steps:
          - icon: "fas fa-database"
            class: "sql"
            label: "Azure SQL"
            detail: "Reporting data"

          - icon: "fas fa-layer-group"
            class: "model"
            label: "Data Model"
            detail: "Business logic"


          - icon: "fas fa-chart-bar"
            class: "powerbi"
            label: "Power BI"
            detail: "Self-service insights"

        insightTags:
          - "Price Trends"
          - "Sales Performance"
          - "Pareto Analysis"
          - "Seasonality"
          - "Raw Material Costs"






  # Education
  education:
    enable: true
    title: "Education"

    items:
      - type: "master"
        date: "2023 – 2026"
        degree: "MSc in Social Data Science"
        school: "University of Copenhagen"
        location: "Copenhagen, Denmark"

        intro: >-
          An interdisciplinary programme combining computational methods,
          statistics, and social science to understand how data can be
          collected, structured, analysed, modelled, validated, and
          responsibly used.

        areas:
          - number: "01"
            icon: "fas fa-code"
            class: "programming"
            title: "Programming & Data"
            keywords:
              - "Python"
              - "Data Collection"
              - "APIs & Web Data"
              - "Preprocessing"
            description: >-
              Hands-on coursework in Python, programmatic data collection,
              data cleaning and preprocessing, exploratory analysis,
              reproducible workflows, and working with APIs, web data,
              and unstructured datasets.

          - number: "02"
            icon: "fas fa-chart-line"
            class: "statistics"
            title: "Statistics & Machine Learning"
            keywords:
              - "Regression"
              - "Supervised Learning"
              - "Cross-validation"
              - "Model Evaluation"
            description: >-
              Applied quantitative methods including regression, statistical
              modelling, supervised learning, cross-validation, and model
              evaluation, with experience comparing different model families
              and interpreting their trade-offs.

          - number: "03"
            icon: "fas fa-language"
            class: "nlp"
            title: "NLP & Computational Methods"
            keywords:
              - "TF-IDF"
              - "Text Classification"
              - "BERT"
              - "Network Analysis"
            description: >-
              Worked with text preprocessing, TF-IDF, text classification,
              embeddings, transformer-based approaches, computational text
              analysis, and network analysis, with an emphasis on validation
              and interpretation.

          - number: "04"
            icon: "fas fa-database"
            class: "database"
            title: "Databases & Data Governance"
            keywords:
              - "SQL & PostgreSQL"
              - "Relational Design"
              - "Data Quality"
              - "GDPR & Governance"
            description: >-
              Studied relational database design, ER modelling, normalization,
              indexing, and query efficiency alongside data quality, privacy,
              GDPR, stewardship, ownership, access, and responsible data
              management.

        additional:
          - "Information Retrieval"
          - "Recommender Systems"
          - "Learning to Rank"
          - "Production Data Science"
          - "Docker / DevOps Concepts"


      - type: "bachelor"
        date: "2019 – 2023"
        degree: "B.Ec. in International Economics and Trade & Japanese"
        school: "Shanghai International Studies University"
        location: "Shanghai, China"

        intro: >-
          Combined economics, international business, and Japanese language
          studies, providing a business-oriented foundation that complements
          my later technical training in data science.

        keywords:
          - "Economics"
          - "International Business"
          - "Japanese"


