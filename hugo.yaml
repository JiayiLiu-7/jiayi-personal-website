      # =====================================================
      # CASE COMPETITION
      # =====================================================

      - number: "03"
        category: "Applied Analytics"
        title: "Data & Analytics Challenge 2024"
        subtitle: "Diabetes prevention and care in low- and middle-income countries"

        description: >-
          Worked on a case presented by the World Diabetes Foundation,
